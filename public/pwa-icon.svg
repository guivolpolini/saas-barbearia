<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#24211a"/>
      <stop offset="60%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8e7c9"/>
      <stop offset="50%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#937233"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c8a96e" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#goldBorder)" stroke-width="6"/>

  <!-- Center emblem (Scissors + Crown motif) -->
  <g transform="translate(136, 120)">
    <!-- Crown -->
    <path d="M40 30 L65 70 L120 15 L175 70 L200 30 L190 90 L50 90 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <circle cx="40" cy="25" r="7" fill="#f8e7c9"/>
    <circle cx="120" cy="10" r="8" fill="#f8e7c9"/>
    <circle cx="200" cy="25" r="7" fill="#f8e7c9"/>

    <!-- Scissors -->
    <g transform="translate(10, 80)">
      <!-- Left blade & handle -->
      <circle cx="50" cy="180" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
      <path d="M72 160 L170 15" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>
      
      <!-- Right blade & handle -->
      <circle cx="170" cy="180" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
      <path d="M148 160 L50 15" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>

      <!-- Pivot screw -->
      <circle cx="110" cy="92" r="10" fill="#09090b" stroke="url(#goldGrad)" stroke-width="6"/>
    </g>
  </g>

  <!-- Bottom text brand -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="6" fill="url(#goldGrad)" text-anchor="middle">PRIME</text>
</svg>
